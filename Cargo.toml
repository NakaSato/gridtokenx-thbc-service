[workspace]
resolver = "2"
members = [
    "crates/thbc-core",
    "crates/thbc-ledger",
    "crates/thbc-persistence",
    "crates/thbc-logic",
    "crates/thbc-api",
    "bin/thbc-service",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The payment leg must never panic on a value it received from a bank, a user, or
# the chain. Every fallible step returns a typed error instead.
#
# Test modules re-allow these locally (`#![cfg_attr(test, allow(...))]` in each
# lib.rs, `#![allow(...)]` at the top of each integration test): a test asserting
# that a guard fires is *supposed* to unwrap, and threading `?` through assertions
# obscures what is being asserted.
unwrap_used = "deny"
expect_used = "deny"
# Every fallible function here returns `CoreError` or `PortError`, both of which
# document each variant against the invariant it protects, and the function docs say
# when they fire. A mandatory `# Errors` heading would restate that 40+ times.
missing_errors_doc = "allow"

[workspace.dependencies]
# Internal crates
thbc-core = { path = "crates/thbc-core" }
thbc-ledger = { path = "crates/thbc-ledger" }
thbc-persistence = { path = "crates/thbc-persistence" }
thbc-logic = { path = "crates/thbc-logic" }
thbc-api = { path = "crates/thbc-api" }

# Async runtime
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
] }

# Web framework
axum = { version = "0.8.7", features = ["macros"] }
tower-http = { version = "0.6.1", features = ["trace", "timeout"] }

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "chrono",
    "uuid",
    "migrate",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time & identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Errors & logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Stream combinators — needed to await a reply off a NATS Subscriber, which
# implements Stream and has no inherent `next()`.
futures = "0.3"

# Messaging — Chain Bridge is reached over NATS JetStream, never Solana RPC.
async-nats = "0.37"

# The `chain.tx.*` wire schema + envelope signing, shared with Chain Bridge so
# the publisher and the verifier cannot drift.
#
# This does NOT compromise the "chain-light" property: `blockchain-types` is the
# deliberately-extracted light half of `gridtokenx-blockchain-core` and depends
# only on serde/base64/p256/sha2/anyhow/tracing — no solana-sdk, no anchor, no
# SPL, no tonic. F8's structural claim (this service holds no key that can move
# user funds) is untouched. `gridtokenx-aggregator-bridge` made the same call for
# the same reason, replacing a byte-for-byte local mirror of these types; do not
# re-create that mirror here.
gridtokenx-blockchain-types = { path = "../gridtokenx-blockchain-core/crates/blockchain-types" }

# Hashing — bank_ref nullifier seed (F3)
sha2 = "0.10"

# Account bytes come back base64 over chain.query.account
base64 = "0.22"

# Config
dotenvy = "0.15"

# Tests
proptest = "1.9"
# Drives an axum `Router` in-process via `ServiceExt::oneshot`, so the API tests
# exercise real routing, extraction and the error→HTTP mapping without binding a
# socket. Dev-only; nothing in the service depends on it.
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
